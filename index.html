<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">             
</head>
<body>
    <div class="container">
        <div>
            <h3 class="home-font">HOMEs</h3>
            <h3 class="dashboard" id="home-score">0</h3>
            <button onclick="add1Point()">+1</button>
            <button onclick="add2Point()">+2</button>
            <button onclick="add3Point()">+3</button>
        </div>
        <div>
            <h3 class="home-font">GUEST</h3>
            <h3 class="dashboard" id="guest-score">0</h3>
            <button onclick="add1Pointguest()">+1</button>
            <button onclick="add2Pointguest()">+2</button>
            <button onclick="add3Pointguest()">+3</button>
        </div>
        <script src="index.js"></script>
    </div>
</body>
</html>
